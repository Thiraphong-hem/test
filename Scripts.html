<script>
const categories=['กระดาษ','พลาสติก','แก้ว','เหล็ก','อะลูมิเนียม','อื่น ๆ'];
const round=n=>Math.round((n+Number.EPSILON)*100)/100;
function totals(items){return {weight:round(items.reduce((a,i)=>a+Number(i.weight),0)),amount:round(items.reduce((a,i)=>a+round(Number(i.weight)*Number(i.price)),0))};}
function payment(s){const total=totals(s.items).amount,received=Number(s.received)||0;return {received,balance:round(total-received),status:received===0?'ยังไม่ได้รับ':received<total?'รับบางส่วน':'รับครบแล้ว'};}
function validate(s){if(!s.date||!s.company.trim()||!s.author.trim()||!s.department.trim())throw Error('กรุณากรอกวันที่ขาย บริษัท ผู้บันทึก และหน่วยงาน');if(!s.items.length)throw Error('กรุณาเพิ่มรายการขยะอย่างน้อย 1 รายการ');for(const i of s.items){if(!categories.includes(i.category)||!i.unit.trim())throw Error('กรุณาระบุประเภทและหน่วยให้ครบ');for(const k of ['quantity','weight','price'])if(!Number.isFinite(Number(i[k]))||Number(i[k])<0||String(i[k]).trim()==='')throw Error('จำนวน น้ำหนัก และราคาต้องเป็นตัวเลขตั้งแต่ 0 ขึ้นไป');if(Number(i.weight)===0)throw Error('น้ำหนักต้องมากกว่า 0');}const total=totals(s.items).amount;if(!Number.isFinite(Number(s.received))||Number(s.received)<0||Number(s.received)>total)throw Error('เงินที่ได้รับต้องอยู่ระหว่าง 0 ถึงยอดขายรวม');if(Number(s.received)>0&&!s.paymentDate)throw Error('กรุณาระบุวันที่รับเงิน');if(s.deliveryStatus==='ส่งมอบแล้ว'&&(!s.deliveryDate||!s.responsible.trim()))throw Error('กรุณาระบุวันที่ส่งมอบและผู้รับผิดชอบ');return s;}
function filtered(sales,f){return sales.filter(s=>(!f.q||[s.number,s.company,s.author,s.department,...s.items.map(i=>i.description)].join(' ').toLowerCase().includes(f.q.toLowerCase()))&&(!f.from||s.date>=f.from)&&(!f.to||s.date<=f.to)&&(!f.category||s.items.some(i=>i.category===f.category))&&(!f.status||payment(s).status===f.status));}

// Minimal Office Open XML workbook; stored ZIP entries keep dependency-free.
const enc=new TextEncoder();
const escape=s=>String(s??'').replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&apos;'}[c])).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'');
function crc32(bytes){let n=0xffffffff;for(const b of bytes){n^=b;for(let i=0;i<8;i++)n=(n>>>1)^((n&1)?0xedb88320:0);}return(n^0xffffffff)>>>0;}
function workbook(rows){const files={
'[Content_Types].xml':'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>',
'_rels/.rels':'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>',
'xl/workbook.xml':'<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="รายการขายรีไซเคิล" sheetId="1" r:id="rId1"/></sheets></workbook>',
'xl/_rels/workbook.xml.rels':'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>',
'xl/worksheets/sheet1.xml':'<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>'+rows.map((r,i)=>'<row r="'+(i+1)+'">'+r.map(v=>typeof v==='number'?'<c><v>'+v+'</v></c>':'<c t="inlineStr"><is><t xml:space="preserve">'+escape(v)+'</t></is></c>').join('')+'</row>').join('')+'</sheetData></worksheet>'};
let offset=0;const local=[],central=[];for(const [path,content]of Object.entries(files)){const name=enc.encode(path),data=enc.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+content),crc=crc32(data);const h=new Uint8Array(30+name.length),v=new DataView(h.buffer);v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint32(14,crc,true);v.setUint32(18,data.length,true);v.setUint32(22,data.length,true);v.setUint16(26,name.length,true);h.set(name,30);local.push(h,data);const c=new Uint8Array(46+name.length),w=new DataView(c.buffer);w.setUint32(0,0x02014b50,true);w.setUint16(4,20,true);w.setUint16(6,20,true);w.setUint32(16,crc,true);w.setUint32(20,data.length,true);w.setUint32(24,data.length,true);w.setUint16(28,name.length,true);w.setUint32(42,offset,true);c.set(name,46);central.push(c);offset+=h.length+data.length;}const end=new Uint8Array(22),v=new DataView(end.buffer);v.setUint32(0,0x06054b50,true);v.setUint16(8,central.length,true);v.setUint16(10,central.length,true);v.setUint32(12,central.reduce((a,b)=>a+b.length,0),true);v.setUint32(16,offset,true);return new Blob([...local,...central,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});}

const $=s=>document.querySelector(s), money=n=>Number(n).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2}), num=n=>Number(n).toLocaleString('th-TH',{maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const dateLabel=d=>d?new Date(d+'T12:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'}):'—';
let sales=[],db,editing=null,selected=null,attachments=[],dirty=false,fileLoading=false;
const urls=[];const form=$('#sale-form');
function toast(s){$('#toast').textContent=s;$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,3500);}
function rpc(method,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[method](...args));}
function dbRequest(mode,fn){if(mode==='readonly')return rpc('listSales');let sale;fn({put(s){sale=s;return {};}});return rpc('saveSale',sale);}
function switchPage(page){if(!$('#form-page').hidden&&dirty&&page!=='form'&&!confirm('มีข้อมูลที่ยังไม่ได้บันทึก ต้องการออกจากฟอร์มหรือไม่?'))return false;for(const [key,id]of [['overview','overview'],['form','form-page'],['reports','reports']])$('#'+id).hidden=key!==page;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#breadcrumb').textContent={overview:'ภาพรวมและประวัติ',form:'บันทึกการขาย',reports:'รายงานสรุป'}[page];if(page==='reports')renderReport();window.scrollTo(0,0);return true;}
function options(selected=''){return categories.map(c=>'<option '+(c===selected?'selected':'')+'>'+c+'</option>').join('');}
function addItem(i={category:'กระดาษ',description:'',quantity:1,unit:'ถุง',weight:'',price:''}){const row=document.createElement('div');row.className='item';row.innerHTML='<div class="item-head"><b>รายการขยะ</b><button type="button" class="text-button remove">ลบรายการ</button></div><div class="item-grid"><label>ประเภทขยะ *<select data-key="category">'+options(i.category)+'</select></label><label>รายละเอียดวัสดุ<input data-key="description" value="'+esc(i.description)+'" placeholder="เช่น กระดาษลังคัดแยก"></label>'+[['quantity','จำนวน *'],['unit','หน่วย *'],['weight','น้ำหนักสุทธิ (กก.) *'],['price','ราคา / กก. (บาท) *']].map(([key,label])=>'<label>'+label+'<input data-key="'+key+'" '+(key==='unit'?'':'type="number" min="'+(key==='weight'?'0.01':'0')+'" step="0.01"')+' required value="'+esc(i[key])+'"></label>').join('')+'<div class="line-total"></div></div>';row.querySelector('.remove').onclick=()=>{if($('#items').children.length===1){toast('ต้องมีรายการขยะอย่างน้อย 1 รายการ');return;}row.remove();dirty=true;updateTotals();};$('#items').append(row);updateTotals();}
function itemValues(){return [...document.querySelectorAll('.item')].map(row=>Object.fromEntries([...row.querySelectorAll('[data-key]')].map(e=>[e.dataset.key,['quantity','weight','price'].includes(e.dataset.key)?(e.value===''?'':Number(e.value)):e.value])));}
function readForm(){return {...Object.fromEntries(new FormData(form)),items:itemValues()};}
function updateTotals(){const s=readForm(),t=totals(s.items),p=payment(s);[...document.querySelectorAll('.item')].forEach((el,i)=>el.querySelector('.line-total').textContent=money(round(Number(s.items[i].weight)*Number(s.items[i].price)))+' บาท');$('#form-totals').innerHTML='<span>น้ำหนักรวม <b>'+num(t.weight)+' กก.</b></span><span>ยอดขายรวม <b>'+money(t.amount)+' บาท</b></span>';$('#payment-summary').textContent=p.status+' · คงเหลือ '+money(p.balance)+' บาท';form.elements.received.max=t.amount;form.elements.paymentDate.required=Number(s.received)>0;form.elements.deliveryDate.required=s.deliveryStatus==='ส่งมอบแล้ว';form.elements.responsible.required=s.deliveryStatus==='ส่งมอบแล้ว';}
function newSale(s=null){if(!switchPage('form'))return;form.reset();editing=s?.id||null;dirty=false;$('#form-error').textContent='';$('#form-title').textContent=s?'แก้ไขรายการขาย':'บันทึกการขายใหม่';$('#items').replaceChildren();attachments=s?[...s.attachments]:[];const data=s||{number:'RC-'+today().replaceAll('-','')+'-'+crypto.randomUUID().slice(0,6).toUpperCase(),date:today(),received:0};for(const [key,value]of Object.entries(data))if(form.elements[key]&&typeof value!=='object')form.elements[key].value=value;(s?.items||[undefined]).forEach(i=>addItem(i));renderAttachments();updateTotals();}
function renderAttachments(){$('#attachment-list').innerHTML=attachments.map((a,i)=>'<div class="attachment"><span>'+esc(a.name)+' <small>('+num((a.size||0)/1024)+' KB)</small></span><button type="button" class="text-button" data-remove-file="'+i+'">ลบ</button></div>').join('');$('#attachment-list').querySelectorAll('[data-remove-file]').forEach(b=>b.onclick=()=>{attachments.splice(Number(b.dataset.removeFile),1);dirty=true;renderAttachments();});}
$('#attachments').onchange=async e=>{fileLoading=true;$('#save').disabled=true;try{for(const f of e.target.files){if(!(f.type.startsWith('image/')||f.type==='application/pdf'))throw Error('รองรับเฉพาะรูปภาพและ PDF');if(f.size>10*1024*1024)throw Error('ไฟล์ '+f.name+' มีขนาดเกิน 10 MB');}for(const f of e.target.files)attachments.push({name:f.name,size:f.size,type:f.type,data:await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result.split(',')[1]);r.onerror=reject;r.readAsDataURL(f);})});dirty=true;renderAttachments();}catch(e){toast(e.message);}finally{e.target.value='';fileLoading=false;$('#save').disabled=false;}};
form.oninput=()=>{dirty=true;updateTotals();};form.onchange=()=>{dirty=true;updateTotals();};
form.onsubmit=async e=>{e.preventDefault();if(fileLoading||!db)return;$('#save').disabled=true;$('#form-error').textContent='';try{const s=validate(readForm());s.id=editing||crypto.randomUUID();s.attachments=attachments;s.createdAt=sales.find(x=>x.id===s.id)?.createdAt||new Date().toISOString();s.updatedAt=new Date().toISOString();await dbRequest('readwrite',store=>store.put(s));sales=await dbRequest('readonly',store=>store.getAll());dirty=false;render();switchPage('overview');toast('บันทึกการขายเรียบร้อยแล้ว');}catch(err){$('#form-error').textContent=err.name==='QuotaExceededError'?'พื้นที่เก็บข้อมูลเต็ม กรุณาลดขนาดไฟล์แนบ':err.message;}finally{$('#save').disabled=false;}};
function getFilters(){return{q:$('#search').value.trim(),from:$('#from').value,to:$('#to').value,category:$('#filter-category').value,status:$('#filter-status').value};}
function visibleSales(){return filtered(sales,getFilters()).sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt.localeCompare(a.createdAt));}
function pill(s){const p=payment(s);return '<span class="pill '+(p.status==='ยังไม่ได้รับ'?'pending':p.status==='รับบางส่วน'?'partial':'')+'">'+p.status+'</span>';}
function render(){const active=sales.filter(s=>s.deliveryStatus!=='ยกเลิก'),weight=active.reduce((a,s)=>a+totals(s.items).weight,0),value=active.reduce((a,s)=>a+totals(s.items).amount,0),received=active.reduce((a,s)=>a+payment(s).received,0);$('#stats').innerHTML=[['↗','มูลค่าการขายทั้งหมด',money(value),'บาท','ไม่รวมรายการยกเลิก'],['♧','น้ำหนักรีไซเคิลรวม',num(weight),'กก.','จาก '+active.length+' รายการขาย'],['✓','เงินที่ได้รับแล้ว',money(received),'บาท','ยอดรับเงินจริงทั้งหมด'],['◷','ยอดค้างรับ',money(round(value-received)),'บาท','ติดตามยอดเงินที่ยังไม่ได้รับ']].map(([icon,label,v,unit,note])=>'<div class="stat"><span class="icon">'+icon+'</span><div class="stat-label">'+label+'</div><div class="stat-value">'+v+'<small>'+unit+'</small></div><div class="stat-note">'+note+'</div></div>').join('');const list=visibleSales();$('#count').textContent=list.length+' รายการ';$('#empty').hidden=!!list.length;if(!list.length){$('#empty h3').textContent=sales.length?'ไม่พบรายการที่ตรงกับตัวกรอง':'เริ่มต้นบันทึกการขายครั้งแรก';$('#empty p').innerHTML=sales.length?'ลองเปลี่ยนคำค้นหาหรือล้างตัวกรอง':'เพิ่มรายการขยะที่ขาย น้ำหนัก และรายรับ<br>เพื่อให้คุณติดตามทุกการรีไซเคิลได้ในที่เดียว';}$('#sales-body').innerHTML=list.map(s=>{const t=totals(s.items);return '<tr><td><b>'+esc(s.number)+'</b><small>'+dateLabel(s.date)+'</small></td><td>'+esc(s.company)+(s.deliveryStatus==='ยกเลิก'?'<small class="cancelled">ยกเลิก</small>':'<small>'+esc(s.deliveryStatus)+'</small>')+'</td><td>'+esc([...new Set(s.items.map(i=>i.category))].join(', '))+'</td><td class="numeric">'+num(t.weight)+'</td><td class="numeric"><b>'+money(t.amount)+'</b></td><td>'+pill(s)+'</td><td><button class="text-button" data-open="'+s.id+'">ดูรายละเอียด ↗</button></td></tr>';}).join('');$('#sales-body').querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>showDetail(b.dataset.open));}
function showDetail(id){selected=sales.find(s=>s.id===id);if(!selected)return;urls.splice(0).forEach(u=>URL.revokeObjectURL(u));const s=selected,t=totals(s.items),p=payment(s);$('#detail-content').innerHTML='<div class="eyebrow">SALE RECEIPT</div><h1>'+esc(s.number)+'</h1>'+pill(s)+'<div class="detail-grid">'+[['วันที่ขาย',dateLabel(s.date)],['บริษัทรับซื้อ',s.company],['ข้อมูลติดต่อ',s.contact],['ผู้บันทึก / หน่วยงาน',s.author+' / '+s.department],['การส่งมอบ',s.deliveryMethod+' · '+s.deliveryStatus],['วันที่ส่งมอบ / ผู้รับผิดชอบ',dateLabel(s.deliveryDate)+' / '+(s.responsible||'—')],['วันที่รับเงิน',dateLabel(s.paymentDate)],['ช่องทางรับเงิน',s.channel]].map(([l,v])=>'<div><small>'+l+'</small>'+esc(v||'—')+'</div>').join('')+'</div><div class="table-wrap"><table><thead><tr><th>รายการขยะ</th><th>จำนวน</th><th>กก.</th><th>ราคา/กก.</th><th>รวม (บาท)</th></tr></thead><tbody>'+s.items.map(i=>'<tr><td>'+esc(i.category)+'<small>'+esc(i.description)+'</small></td><td>'+num(i.quantity)+' '+esc(i.unit)+'</td><td>'+num(i.weight)+'</td><td>'+money(i.price)+'</td><td>'+money(round(i.weight*i.price))+'</td></tr>').join('')+'</tbody></table></div><div class="report-summary"><b>น้ำหนักรวม '+num(t.weight)+' กก. · ยอดขาย '+money(t.amount)+' บาท</b><p>รับเงินจริง '+money(p.received)+' บาท · ค้างรับ '+money(p.balance)+' บาท</p></div><h3>การดำเนินการเพิ่มเติม</h3><p class="detail-notes">'+esc(s.notes||'—')+'</p><h3>หลักฐานแนบ</h3>'+(s.attachments.length?s.attachments.map(a=>{const url=a.url;urls.push(url);return '<div class="attachment"><a href="'+url+'" target="_blank" rel="noopener">↓ '+esc(a.name)+'</a></div>';}).join(''):'<p>ไม่มีเอกสารแนบ</p>');$('#detail').showModal();}
function renderReport(){const month=$('#report-month').value,list=sales.filter(s=>s.deliveryStatus!=='ยกเลิก'&&(!month||s.date.startsWith(month)));const total=list.reduce((a,s)=>a+totals(s.items).amount,0),received=list.reduce((a,s)=>a+payment(s).received,0);$('#report-content').innerHTML='<div class="report-summary"><h2>'+esc(month?new Date(month+'-01T12:00:00').toLocaleDateString('th-TH',{month:'long',year:'numeric'}):'ทุกเดือน')+' · '+list.length+' รายการ</h2><p>ยอดขาย '+money(total)+' บาท · รับเงินจริง '+money(received)+' บาท · ค้างรับ '+money(round(total-received))+' บาท</p><p>ยอดเงินจัดกลุ่มตามเดือนที่ขาย</p></div><div class="table-wrap"><table><thead><tr><th>ประเภทขยะ</th><th class="numeric">น้ำหนัก (กก.)</th><th class="numeric">มูลค่าขาย (บาท)</th></tr></thead><tbody>'+categories.map(c=>{const items=list.flatMap(s=>s.items).filter(i=>i.category===c),t=totals(items);return '<tr><td>'+c+'</td><td class="numeric">'+num(t.weight)+'</td><td class="numeric">'+money(t.amount)+'</td></tr>';}).join('')+'</tbody><tfoot><tr><td><b>รวมทั้งหมด</b></td><td class="numeric">'+num(list.reduce((a,s)=>a+totals(s.items).weight,0))+'</td><td class="numeric">'+money(total)+'</td></tr></tfoot></table></div>';}
function exportExcel(){const list=visibleSales();if(!list.length){toast('ไม่มีรายการสำหรับส่งออก');return;}const rows=[['เลขที่รายการ','วันที่ขาย','บริษัท','ติดต่อ','ผู้บันทึก','หน่วยงาน','ประเภท','รายละเอียด','จำนวน','หน่วย','น้ำหนัก (กก.)','ราคาต่อกก.','มูลค่ารายการ','วิธีส่งมอบ','สถานะส่งมอบ','วันที่ส่งมอบ','ผู้รับผิดชอบ','สถานะรับเงิน','รับเงินจริง (ครั้งเดียวต่อการขาย)','ค้างรับ (ครั้งเดียวต่อการขาย)','วันที่รับเงิน','ช่องทางรับเงิน','หมายเหตุ']];for(const s of list)s.items.forEach((i,index)=>rows.push([s.number,s.date,s.company,s.contact,s.author,s.department,i.category,i.description,Number(i.quantity),i.unit,Number(i.weight),Number(i.price),round(i.weight*i.price),s.deliveryMethod,s.deliveryStatus,s.deliveryDate,s.responsible,payment(s).status,index===0?payment(s).received:'',index===0?payment(s).balance:'',s.paymentDate,s.channel,s.notes]));const url=URL.createObjectURL(workbook(rows)),a=document.createElement('a');a.href=url;a.download='recycle-sales-'+today()+'.xlsx';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('ส่งออก Excel เรียบร้อยแล้ว');}
$('#today').textContent=new Date().toLocaleDateString('th-TH',{timeZone:'Asia/Bangkok',day:'numeric',month:'long',year:'numeric'});
$('#filter-category').insertAdjacentHTML('beforeend',options());
for(const id of ['search','from','to','filter-category','filter-status'])$('#'+id).oninput=render;
$('#reset-filters').onclick=()=>{for(const id of ['search','from','to','filter-category','filter-status'])$('#'+id).value='';render();};
for(const id of ['new-sale','empty-add'])$('#'+id).onclick=()=>newSale();
for(const id of ['back','cancel'])$('#'+id).onclick=()=>switchPage('overview');
$('#add-item').onclick=()=>{addItem();dirty=true;};
$('nav').onclick=e=>{const b=e.target.closest('[data-page]');if(b){if(b.dataset.page==='form'){if($('#form-page').hidden)newSale();}else switchPage(b.dataset.page);}};
